ktor {
  env = ${?KTOR_ENV}

  deployment {
    port = 8080
    port = ${?PORT}
  }

  application {
    modules = [
      io.github.phobosxiii.DIKt.configureDependencyInjection
      io.github.phobosxiii.SerializationKt.configureSerialization
      io.github.phobosxiii.SecurityKt.configureSecurity
      io.github.phobosxiii.WebsocketsKt.configureWebsockets
      io.github.phobosxiii.RoutingKt.configureRouting
      io.github.phobosxiii.StatusPagesKt.configureStatusPages
      io.github.phobosxiii.db.DatabaseKt.configureDb
    ]
  }
}